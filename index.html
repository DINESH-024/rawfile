<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7ff" />
    <title>Customer Feedback Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <script src="js/page-transitions.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-one"></span><span class="orb orb-two"></span><span class="orb orb-three"></span>
      <span class="reflection reflection-one"></span><span class="reflection reflection-two"></span>
      <span class="particles"></span>
    </div>

    <main class="portal-frame">
      <section class="feedback-panel" aria-labelledby="page-title">
        <header class="brand">
          <img src="assets/logo.jpg" alt="LumenVue" class="brand-logo" decoding="async" />
          <div>
            <p class="brand-name">LumenVue</p>
          </div>
        </header>

        <form id="feedbackForm" novalidate>
          <div class="intro">
            <h1 id="page-title">We Value Your Feedback</h1>
          </div>

          <fieldset class="rating-fieldset">
            <legend>How was your experience?</legend>
            <div class="emoji-options" role="radiogroup" aria-label="Select your experience rating">
              <button type="button" class="emoji" role="radio" aria-checked="false" aria-label="Loved it" data-emoji="🩷">🩷</button>
              <button type="button" class="emoji" role="radio" aria-checked="false" aria-label="Very happy" data-emoji="😄">😄</button>
              <button type="button" class="emoji" role="radio" aria-checked="false" aria-label="Good" data-emoji="👍">👍</button>
              <button type="button" class="emoji" role="radio" aria-checked="false" aria-label="Not good" data-emoji="👎">👎</button>
              <button type="button" class="emoji" role="radio" aria-checked="false" aria-label="Disappointed" data-emoji="😒">😒</button>
            </div>
          </fieldset>
          <input type="hidden" id="emojiValue" name="emoji" />

          <div class="feedback-input">
            <label for="message">Tell us more</label>
            <textarea id="message" name="message" maxlength="500" placeholder="Share any details that could help us improve..." rows="5" required aria-describedby="charCounter"></textarea>
            <p id="charCounter" class="char-counter" aria-live="polite"><span id="charCount">0</span> / 500</p>
          </div>

          <button id="submitBtn" class="submit-button" type="submit">
            <span class="button-label">Submit Feedback</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <p id="result" class="result" role="status" aria-live="polite"></p>
        </form>

        <p class="privacy"><span aria-hidden="true">⌁</span> Your feedback is securely processed and used only to improve our services.</p>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
