services:
  - type: web
    name: deepika-birthday-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: EMAIL_HOST_USER
        value: "itzmenobita007@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "itzmenobita007@gmail.com"
      - key: BIRTHDAY_WISH_RECEIVER
        value: "itzmenobita007@gmail.com"
      - key: BIRTHDAY_SITE_URL
        value: "https://DINESH-024.github.io/deepika-birthday/"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://DINESH-024.github.io"
